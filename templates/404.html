<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Job Market Analytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">JM<span>D</span></a>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/jobs">All Jobs</a>
    <a href="/predict">Salary Predictor</a>
    <button type="button" onclick="toggleTheme()" class="theme-toggle" title="Switch theme (Midnight / Daylight)" aria-label="Switch theme">◐</button>
  </div>
</nav>

<div class="container not-found">
  <div class="not-found-inner">
    <div class="not-found-code">404</div>
    <h2>Page not found</h2>
    <p>The page or job listing you’re looking for doesn’t exist or has been removed.</p>
    <a href="/" class="btn-apply">Return to dashboard →</a>
  </div>
</div>

<footer>Job Market Analytics — Flask, Pandas, Plotly &amp; Supabase</footer>

<script>
  (function(){ if (localStorage.getItem('theme') === 'light') document.body.classList.add('light'); })();(function(){ if(localStorage.getItem('theme')==='light') document.body.classList.add('light'); })();
  function toggleTheme(){ var on = document.body.classList.toggle('light'); localStorage.setItem('theme', on ? 'light' : 'dark'); }
</script>

</body>
</html>
