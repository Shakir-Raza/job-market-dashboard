<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Interactive Particle Background Canvas -->
<canvas id="hero-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

<nav>
  <a href="/" class="nav-logo">JM<span style="color:var(--text); -webkit-text-fill-color: var(--text);">D</span></a>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/jobs">All Jobs</a>
    <a href="/predict">Salary Predictor</a>
    <button onclick="toggleTheme()" class="theme-toggle" title="Toggle dark/light mode">🌓</button>
  </div>
</nav>

<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="prediction-box" style="max-width: 500px; width: 100%;">
    <div class="prediction-number" style="font-size: 5rem; margin-bottom: 8px;">404</div>
    <h2 style="margin-bottom: 12px; color: var(--text); font-family: 'Outfit', sans-serif;">Page Not Found</h2>
    <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;">
      The job listing or dashboard view you are looking for doesn’t exist or has been moved.
    </p>
    <a href="/" class="btn-apply">
      Return to Dashboard →
    </a>
  </div>
</div>

<footer>Job Market Analytics Dashboard — Built with Flask, Pandas, Plotly &amp; Supabase</footer>

<script>
  // Dynamic Interactive Particle Engine
  (function() {
    const canvas = document.getElementById('hero-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let mouse = { x: width / 2, y: height / 2 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.alpha = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          this.x -= (dx / dist) * 1.5;
          this.y -= (dy / dist) * 1.5;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = document.body.classList.contains('light')
          ? `rgba(184, 148, 42, ${this.alpha})`
          : `rgba(201, 168, 76, ${this.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(201, 168, 76, 0.5)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    const particles = Array.from({ length: 65 }, () => new Particle());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = document.body.classList.contains('light')
              ? `rgba(184, 148, 42, ${0.2 * (1 - dist / 140)})`
              : `rgba(201, 168, 76, ${0.25 * (1 - dist / 140)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  })();

  // Theme Toggling Logic
  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
  }

  function toggleTheme() {
    document.body.classList.toggle('light');
    localStorage.setItem('theme',
      document.body.classList.contains('light') ? 'light' : 'dark'
    );
  }
</script>

</body>
</html>
